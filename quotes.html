/* ---------- 今日三则：日期种子确定性轮换 ---------- */
(function renderToday() {
  const ds = todayStr();
  let seed = 0;
  for (const c of ds) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
  const used = new Set(), picks = [];
  for (let i = 0; i < 3; i++) {
    seed = (seed * 1103515245 + 12345) >>> 0;
    let idx = seed % QUOTES.length;
    while (used.has(idx)) idx = (idx + 1) % QUOTES.length;
    used.add(idx); picks.push(QUOTES[idx]);
  }
  const grid = $("qToday");
  grid.innerHTML = "";
  picks.forEach(q => {
    const card = document.createElement("div");
    card.className = "q-card";
    card.innerHTML = '<div class="q-mark">“</div><div class="q-text"></div><div class="q-from"><b></b> · <span></span></div>';
    card.querySelector(".q-text").textContent = q.t;
    card.querySelector(".q-from b").textContent = q.b;
    card.querySelector(".q-from span").textContent = q.a;
    grid.appendChild(card);
  });
  const d = new Date();
  $("qDate").textContent = d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · 星期" + ["日","一","二","三","四","五","六"][d.getDay()];
})();

/* ---------- 语录库：按学段折叠分组，默认收起 ---------- */
(function renderArchive() {
  const box = $("qArchive");
  box.innerHTML = "";
  ["primary", "junior", "senior", "college"].forEach(stage => {
    const list = QUOTES.filter(q => q.s === stage);
    if (!list.length) return;
    const det = document.createElement("details");
    det.className = "q-hist q-stage";
    const sum = document.createElement("summary");
    sum.className = "q-hist-head";
    sum.innerHTML = '<span class="q-hist-date"></span><span class="q-hist-books q-stage-count"></span><span class="q-hist-mark">＋</span>';
    sum.querySelector(".q-hist-date").textContent = STAGE_LABEL[stage];
    sum.querySelector(".q-stage-count").textContent = "共 " + list.length + " 条";
    det.appendChild(sum);
    const ul = document.createElement("ul");
    ul.className = "q-list";
    list.forEach(q => {
      const li = document.createElement("li");
      li.innerHTML = '<div class="qa-text"></div><div class="qa-from"><b></b> · <span></span></div>';
      li.querySelector(".qa-text").textContent = q.t;
      li.querySelector(".qa-from b").textContent = q.b;
      li.querySelector(".qa-from span").textContent = q.a;
      ul.appendChild(li);
    });
    det.appendChild(ul);
    box.appendChild(det);
  });
})();

/* ---------- 往日三则：按日期倒序留档（每页最多 10 天，最新一天默认展开） ---------- */
(function renderHistory() {
  const box = $("qHistory");
  if (!box) return;
  const PAGE_SIZE = 10;
  const totalPages = Math.max(1, Math.ceil(HISTORY.length / PAGE_SIZE));
  let currentPage = 1;

  function pageItems() {
    if (totalPages <= 7) return Array.from({ length: totalPages }, (_, i) => i + 1);
    const pages = [...new Set([1, totalPages, currentPage - 1, currentPage, currentPage + 1]
      .filter(p => p >= 1 && p <= totalPages))].sort((a, b) => a - b);
    const items = [];
    pages.forEach((p, i) => {
      if (i && p - pages[i - 1] > 1) items.push("ellipsis-" + i);
      items.push(p);
    });
    return items;
  }

  function draw() {
    box.innerHTML = "";
    const start = (currentPage - 1) * PAGE_SIZE;
    HISTORY.slice(start, start + PAGE_SIZE).forEach((entry, i) => {
      const dt = new Date(entry.d + "T00:00:00");
      const det = document.createElement("details");
      det.className = "q-hist";
      if (start + i === 0) det.open = true;
      const sum = document.createElement("summary");
      sum.className = "q-hist-head";
      sum.innerHTML = '<span class="q-hist-date"></span><span class="q-hist-books"></span><span class="q-hist-mark">＋</span>';
      sum.querySelector(".q-hist-date").textContent = dt.getFullYear() + " 年 " + (dt.getMonth() + 1) + " 月 " + dt.getDate() + " 日 · 星期" + ["日","一","二","三","四","五","六"][dt.getDay()];
      sum.querySelector(".q-hist-books").textContent = entry.p.map(q => q.b).join(" · ");
      det.appendChild(sum);
      const ul = document.createElement("ul");
      ul.className = "q-list";
      entry.p.forEach(q => {
        const li = document.createElement("li");
        li.innerHTML = '<div class="qa-text"></div><div class="qa-from"><b></b> · <span></span></div>';
        li.querySelector(".qa-text").textContent = q.t;
        li.querySelector(".qa-from b").textContent = q.b;
        li.querySelector(".qa-from span").textContent = q.a;
        ul.appendChild(li);
      });
      det.appendChild(ul);
      box.appendChild(det);
    });

    if (totalPages <= 1) return;
    const pager = document.createElement("div");
    pager.className = "q-pagination";
    pager.setAttribute("role", "navigation");
    pager.setAttribute("aria-label", "往日三则分页");

    function addButton(label, page, options = {}) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "q-page-btn" + (options.active ? " is-active" : "");
      btn.textContent = label;
      btn.disabled = !!options.disabled;
      btn.setAttribute("aria-label", options.ariaLabel || "第 " + page + " 页");
      if (options.active) btn.setAttribute("aria-current", "page");
      btn.addEventListener("click", () => {
        currentPage = page;
        draw();
      });
      pager.appendChild(btn);
    }

    addButton("上一页", currentPage - 1, { disabled: currentPage === 1, ariaLabel: "上一页" });
    pageItems().forEach(item => {
      if (typeof item === "string") {
        const ellipsis = document.createElement("span");
        ellipsis.className = "q-page-ellipsis";
        ellipsis.textContent = "…";
        ellipsis.setAttribute("aria-hidden", "true");
        pager.appendChild(ellipsis);
      } else {
        addButton(String(item), item, { active: item === currentPage });
      }
    });
    addButton("下一页", currentPage + 1, { disabled: currentPage === totalPages, ariaLabel: "下一页" });

    const info = document.createElement("div");
    info.className = "q-page-info";
    info.textContent = "显示 " + (start + 1) + "–" + Math.min(start + PAGE_SIZE, HISTORY.length) + " 条 · 共 " + HISTORY.length + " 天";
    pager.appendChild(info);
    box.appendChild(pager);
  }

  draw();
})();
</script>
